name: Fetch Texts and Build Index

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  fetch-and-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch texts from Gutenberg and EUR-Lex
        run: node scripts/fetch-texts.js
        continue-on-error: true  # Some sources may fail

      - name: Build search index
        run: node scripts/build-search-index.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code docs/data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git commit -m "Update texts and search index [automated]"
          git push
