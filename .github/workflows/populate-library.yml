name: Populate Library

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to download from'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mit
          - gutenberg
          - sacred
          - fordham
          - dante
          - marxists
          - stanford
          - iep
          - wikisource
          - loebolus
          - iqwiki
          - perseus
          - cantigas
          - phi_latin
          - eudocs
          - ctext
          - prussia
          - germanhistorydocs
          - iranica
          - wisdomlib
          - arlima
      limit:
        description: 'Max books per source (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml tqdm

      - name: Populate library
        run: |
          cd ancient-books-rag
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scripts/populate_library.py --source ${{ github.event.inputs.source }} --limit ${{ github.event.inputs.limit }}
          else
            python scripts/populate_library.py --source ${{ github.event.inputs.source }}
          fi

      - name: Build static site data
        run: |
          cd ancient-books-rag
          python scripts/build_static.py

      - name: Move library data to docs
        run: |
          mkdir -p docs/data/texts
          cp ancient-books-rag/docs/data/library-index.json docs/data/
          cp ancient-books-rag/docs/data/library-index.json.gz docs/data/ || true
          cp -r ancient-books-rag/docs/data/texts/* docs/data/texts/ || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Update library data from ${{ github.event.inputs.source }}"
          git push
