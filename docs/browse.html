<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aleph - browse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>א</h1>
            <p class="subtitle">universal catalog</p>
            <nav>
                <a href="index.html">search</a>
                <a href="browse.html" class="active">browse</a>
                <a href="sources.html">sources</a>
                <a href="upload.html">add</a>
            </nav>
        </header>

        <main>
            <div class="catalog-stats" id="catalog-stats">
                <div class="stats-summary">
                    <span id="total-books">0</span> textes
                </div>
            </div>

            <div class="browse-filters">
                <select id="type-filter">
                    <option value="">toutes catégories</option>
                </select>
                <select id="period-filter">
                    <option value="">toutes périodes</option>
                </select>
                <select id="author-filter">
                    <option value="">tous auteurs</option>
                </select>
                <select id="sort-filter">
                    <option value="type">grouper par catégorie</option>
                    <option value="title">trier: titre</option>
                    <option value="author">trier: auteur</option>
                    <option value="period">trier: période</option>
                </select>
                <select id="view-filter">
                    <option value="list">vue liste</option>
                    <option value="compact">compact</option>
                </select>
            </div>

            <div id="book-list" class="books-list">
                <div class="loading">loading...</div>
            </div>

            <div id="pagination" class="pagination"></div>
        </main>

        <footer>
            <p><a href="https://guilhermegfmachado.github.io/work/" target="_blank">Guilherme de G. F. Machado</a></p>
            <p id="sources-footer"></p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>initBrowse();</script>
</body>
</html>
