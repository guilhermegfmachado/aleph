name: Fetch Corpus

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch pdf-parse

      - name: Fetch corpus texts
        run: node fetch_corpus.js

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/corpus/*.txt || true
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Add fetched corpus texts"
          git push
