<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aleph - add</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>aleph</h1>
            <p class="subtitle">an infinite library</p>
            <nav>
                <a href="index.html">search</a>
                <a href="browse.html">browse</a>
                <a href="upload.html" class="active">add</a>
            </nav>
        </header>

        <main>
            <div class="upload-section">
                <h2>expand the library</h2>

                <div class="upload-box" id="dropzone">
                    <div class="dropzone-content">
                        <div class="drop-icon">+</div>
                        <p>drop files here</p>
                        <p class="hint">PDF, EPUB, TXT</p>
                        <input type="file" id="file-input" accept=".pdf,.txt,.epub" multiple hidden>
                        <button class="btn" onclick="document.getElementById('file-input').click()">choose files</button>
                    </div>
                </div>

                <div id="processing-status" class="processing-status hidden">
                    <span id="status-text">processing...</span>
                </div>

                <div id="upload-queue" class="upload-queue hidden">
                    <h3><span id="queue-count">0</span> files</h3>
                    <div id="queue-list"></div>
                </div>
            </div>

            <div class="user-books-section">
                <div class="section-header">
                    <h3>your texts <span id="user-book-count">(0)</span></h3>
                    <div class="library-actions">
                        <button class="btn" onclick="publishToGitHub()">publish</button>
                        <button class="btn btn-small" onclick="clearAllBooks()">clear</button>
                    </div>
                </div>
                <p class="library-hint" id="publish-hint">publish to share with others</p>
                <div id="user-books-list" class="user-books-list">
                    <p class="empty-state">no texts yet</p>
                </div>
            </div>

            <details class="github-settings">
                <summary>settings</summary>
                <div class="settings-content">
                    <p>GitHub token for publishing:</p>
                    <div class="form-group">
                        <input type="password" id="github-token" placeholder="ghp_...">
                        <button class="btn btn-small" onclick="saveGitHubToken()">save</button>
                    </div>
                    <div class="form-group">
                        <label>Repository:</label>
                        <input type="text" id="github-repo" placeholder="user/repo">
                    </div>
                    <p class="hint"><a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">create token</a> with repo scope</p>
                </div>
            </details>
        </main>

        <footer></footer>
    </div>

    <script src="app.js"></script>
    <script src="upload.js"></script>
</body>
</html>
