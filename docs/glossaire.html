<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){var t=localStorage.getItem('aleph-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>aleph — glossaire</title>
    <meta name="description" content="Glossaire multilingue de termes historiques, littéraires, politiques et philosophiques.">
    <meta name="author" content="Guilherme de G. F. Machado">
    <meta property="og:title" content="glossaire — aleph">
    <meta property="og:description" content="Glossaire multilingue de termes historiques, littéraires, politiques et philosophiques.">
    <meta property="og:url" content="https://guilhermegfmachado.github.io/aleph/glossaire.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://guilhermegfmachado.github.io/aleph/glossaire.html">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#070809">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">א</a>
        <ul class="nav-links">
            <li><a href="index.html">chercher</a></li>
            <li><a href="browse.html">parcourir</a></li>
            <li><a href="glossaire.html" class="active">glossaire</a></li>
            <li><a href="sources.html">références</a></li>
        </ul>
        <button class="nav-theme-btn" id="themeToggle" aria-label="basculer thème" title="thème clair / sombre">&#9681;</button>
    </nav>

    <main class="glossaire-page">
        <div class="glossaire-header">
            <h1 class="glossaire-title">Glossaire <em>multilingue</em></h1>
            <div class="glossaire-stats">
                <span id="term-count">0</span> termes · <span id="quote-count">0</span> citations · <span id="lang-count">0</span> langues
            </div>
        </div>

        <!-- View Toggle -->
        <div class="glossaire-tabs">
            <button class="tab-btn active" data-view="terms">termes</button>
            <button class="tab-btn" data-view="quotes">citations</button>
        </div>

        <!-- Search -->
        <input type="search" id="glossary-search" class="glossaire-search" placeholder="chercher un terme ou une citation...">

        <!-- Language pills -->
        <div class="lang-pills-row" id="lang-filters">
            <!-- Language buttons generated by JS -->
        </div>

        <!-- Category filter -->
        <div class="category-filter">
            <select id="category-select" class="cat-select">
                <option value="">toutes catégories</option>
            </select>
        </div>

        <!-- Terms View -->
        <div id="terms-view" class="glossary-view">
            <div id="terms-list" class="terms-list">
                <!-- Terms rendered here -->
            </div>
        </div>

        <!-- Quotes View -->
        <div id="quotes-view" class="glossary-view hidden">
            <div id="quotes-list" class="quotes-list">
                <!-- Quotes rendered here -->
            </div>
        </div>

        <!-- Add Entry Form (collapsed by default) -->
        <details class="add-entry-section">
            <summary>ajouter une entrée</summary>
            <div class="add-entry-content">
                <div class="entry-type-toggle">
                    <button class="entry-type-btn active" data-type="term">terme</button>
                    <button class="entry-type-btn" data-type="quote">citation</button>
                </div>

                <!-- Term Form -->
                <form id="add-term-form" class="entry-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="term-word">terme *</label>
                            <input type="text" id="term-word" required placeholder="Vermassung">
                        </div>
                        <div class="form-group">
                            <label for="term-lang">langue *</label>
                            <select id="term-lang" required>
                                <option value="de">Deutsch</option>
                                <option value="fr">Français</option>
                                <option value="it">Italiano</option>
                                <option value="pt">Português</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="el">Ελληνικά</option>
                                <option value="la">Latina</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="term-pronunciation">prononciation</label>
                        <input type="text" id="term-pronunciation" placeholder="/fɛɐ̯ˈmasʊŋ/">
                    </div>
                    <div class="form-group">
                        <label for="term-definition">définition *</label>
                        <textarea id="term-definition" required rows="3" placeholder="Mass-ification; the process by which individuals lose their uniqueness..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="term-etymology">étymologie</label>
                        <input type="text" id="term-etymology" placeholder="From German 'Masse' (mass) + '-ung' (process suffix)">
                    </div>
                    <div class="form-group">
                        <label for="term-categories">catégories (séparées par virgule)</label>
                        <input type="text" id="term-categories" placeholder="philosophy, sociology, politics">
                    </div>
                    <div class="form-group">
                        <label for="term-usage">exemple d'usage</label>
                        <textarea id="term-usage" rows="2" placeholder="Ortega y Gasset warned of the dangers of Vermassung..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="term-sources">sources</label>
                        <input type="text" id="term-sources" placeholder="Ortega y Gasset - La rebelión de las masas">
                    </div>
                    <button type="submit" class="btn">ajouter terme</button>
                </form>

                <!-- Quote Form -->
                <form id="add-quote-form" class="entry-form hidden">
                    <div class="form-group">
                        <label for="quote-text">citation *</label>
                        <textarea id="quote-text" required rows="3" placeholder="Was mich nicht umbringt, macht mich stärker."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="quote-translation">traduction</label>
                        <textarea id="quote-translation" rows="2" placeholder="What does not kill me makes me stronger."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="quote-author">auteur *</label>
                            <input type="text" id="quote-author" required placeholder="Friedrich Nietzsche">
                        </div>
                        <div class="form-group">
                            <label for="quote-lang">langue *</label>
                            <select id="quote-lang" required>
                                <option value="de">Deutsch</option>
                                <option value="fr">Français</option>
                                <option value="it">Italiano</option>
                                <option value="pt">Português</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="el">Ελληνικά</option>
                                <option value="la">Latina</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="quote-source">source</label>
                            <input type="text" id="quote-source" placeholder="Götzen-Dämmerung">
                        </div>
                        <div class="form-group">
                            <label for="quote-year">année</label>
                            <input type="number" id="quote-year" placeholder="1888">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="quote-tags">tags (séparés par virgule)</label>
                        <input type="text" id="quote-tags" placeholder="strength, adversity, will">
                    </div>
                    <div class="form-group">
                        <label for="quote-notes">notes</label>
                        <textarea id="quote-notes" rows="2" placeholder="Often misattributed or quoted out of context..."></textarea>
                    </div>
                    <button type="submit" class="btn">ajouter citation</button>
                </form>
            </div>
        </details>
    </main>

    <!-- Entry Modal -->
    <div class="entry-modal-overlay" id="entryModal">
        <div class="entry-modal">
            <button class="modal-close" id="modalClose">fermer</button>
            <div class="modal-lang" id="modalLang"></div>
            <div class="modal-term" id="modalTerm"></div>
            <div class="modal-native" id="modalNative"></div>
            <div class="modal-field-label" id="modalDomainLabel">domaine</div>
            <div class="modal-field-val" id="modalDomain"></div>
            <div class="modal-field-label" id="modalPeriodLabel">période</div>
            <div class="modal-field-val" id="modalPeriod"></div>
            <div class="modal-field-label" id="modalEtymologyLabel">étymologie</div>
            <div class="modal-field-val" id="modalEtymology"></div>
            <div class="modal-gloss" id="modalGloss"></div>
            <div class="modal-field-label" id="modalRelatedLabel">voir aussi</div>
            <div class="modal-links" id="modalRelated"></div>
        </div>
    </div>

    <a class="site-credit" href="https://guilhermegfmachado.github.io/work/" target="_blank" rel="noopener">gmfm</a>
    <script src="glossaire.js"></script>
</body>
</html>
