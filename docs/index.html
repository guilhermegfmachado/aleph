<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aleph</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>א</h1>
            <p class="subtitle" style="opacity:.7;font-size:.8rem;margin-bottom:.75rem;">Bibliothèque de références personnelle — textes, outils, lieux.</p>
            <nav>
                <a href="index.html" class="active">search</a>
                <a href="browse.html">browse</a>
                <a href="sources.html">sources</a>
                <a href="upload.html">add</a>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light theme">●</button>
            </nav>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="search titles, authors, or any word in the text..." autofocus>
                <div class="search-filters">
                    <select id="author-filter">
                        <option value="">all authors</option>
                    </select>
                    <select id="category-filter">
                        <option value="">all categories</option>
                        <option value="philosophy">philosophy</option>
                        <option value="poetry">poetry</option>
                        <option value="drama">drama</option>
                        <option value="prose">prose</option>
                        <option value="non-western">non-western</option>
                        <option value="portuguese">portuguese</option>
                        <option value="economics">economics</option>
                        <option value="treaty">treaty</option>
                        <option value="constitution">constitution</option>
                        <option value="case">case</option>
                    </select>
                    <button id="search-btn">search</button>
                </div>
            </div>

            <div id="results" class="results">
                <div class="welcome" id="welcome">
                    <h2><span id="book-count">0</span> texts from <span id="author-count">0</span> authors</h2>
                    <div class="quick-searches">
                        <p>try:</p>
                        <div class="quick-links">
                            <a href="#" class="quick-search" data-query="love">love</a>
                            <a href="#" class="quick-search" data-query="death">death</a>
                            <a href="#" class="quick-search" data-query="justice">justice</a>
                            <a href="#" class="quick-search" data-query="virtue">virtue</a>
                            <a href="#" class="quick-search" data-query="soul">soul</a>
                            <a href="#" class="quick-search" data-query="fate">fate</a>
                            <a href="#" class="quick-search" data-query="contract">contract</a>
                            <a href="#" class="quick-search" data-query="sovereignty">sovereignty</a>
                            <a href="#" class="quick-search" data-query="capital">capital</a>
                            <a href="#" class="quick-search" data-query="trade">trade</a>
                            <a href="#" class="quick-search" data-query="rights">rights</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p><a href="https://guilhermegfmachado.github.io/work/" target="_blank">Guilherme de G. F. Machado</a></p>
            <p class="latin-phrase">in girum imus nocte et consumimur igni</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
