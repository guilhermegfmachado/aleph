name: Populate Library

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'add'
        type: choice
        options:
          - add
          - remove
      source:
        description: 'Source to add/remove'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mit
          - gutenberg
          - sacred
          - dante
          - marxists
          - stanford
          - iep
          - wikisource
          - loebolus
          - iqwiki
          - perseus
          - cantigas
          - phi_latin
          - eudocs
          - ctext
          - prussia
          - germanhistorydocs
          - iranica
          - wisdomlib
          - arlima
          - bartleby
          - fordham
      limit:
        description: 'Max books per source (leave empty for all, only for add)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml tqdm

      - name: Create data directory
        run: |
          mkdir -p docs/data

      - name: Run library operation
        run: |
          cd ancient-books-rag
          DB_PATH="../docs/data/library.db"

          if [ "${{ github.event.inputs.operation }}" = "remove" ]; then
            echo "Removing source: ${{ github.event.inputs.source }}"
            python scripts/populate_library.py --db-path "$DB_PATH" --remove-source ${{ github.event.inputs.source }}
          else
            echo "Adding source: ${{ github.event.inputs.source }}"
            if [ -n "${{ github.event.inputs.limit }}" ]; then
              python scripts/populate_library.py --db-path "$DB_PATH" --source ${{ github.event.inputs.source }} --limit ${{ github.event.inputs.limit }}
            else
              python scripts/populate_library.py --db-path "$DB_PATH" --source ${{ github.event.inputs.source }}
            fi
          fi

      - name: Build static site data
        run: |
          cd ancient-books-rag
          python scripts/build_static.py --db-path ../docs/data/library.db

      - name: Move library data to docs
        run: |
          mkdir -p docs/data/texts
          cp ancient-books-rag/docs/data/library-index.json docs/data/ || true
          cp ancient-books-rag/docs/data/library-index.json.gz docs/data/ || true
          cp -r ancient-books-rag/docs/data/texts/* docs/data/texts/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/
          git diff --staged --quiet || git commit -m "${{ github.event.inputs.operation }}: ${{ github.event.inputs.source }}"
          git push
