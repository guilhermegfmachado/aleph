name: Populate Library

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'add'
        type: choice
        options:
          - add
          - remove
      source:
        description: 'Source to add/remove'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mit
          - gutenberg
          - dante
          - marxists
          - stanford
          - loebolus
          - iqwiki
          - perseus
          - cantigas
          - phi_latin
          - eudocs
          - ctext
          - prussia
          - germanhistorydocs
          - iranica
          - wisdomlib
          - arlima
      limit:
        description: 'Max books per source (leave empty for all, only for add)'
        required: false
        default: ''
      incremental:
        description: 'Skip sources that already have entries'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml tqdm PyMuPDF

      - name: Create data directory
        run: |
          mkdir -p docs/data

      - name: Run library operation
        run: |
          cd ancient-books-rag
          DB_PATH="../docs/data/library.db"

          if [ "${{ github.event.inputs.operation }}" = "remove" ]; then
            echo "Removing source: ${{ github.event.inputs.source }}"
            python scripts/populate_library.py --db-path "$DB_PATH" --remove-source ${{ github.event.inputs.source }}
          else
            echo "Adding source: ${{ github.event.inputs.source }}"
            ARGS="--db-path $DB_PATH --source ${{ github.event.inputs.source }}"
            if [ -n "${{ github.event.inputs.limit }}" ]; then
              ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
            fi
            if [ "${{ github.event.inputs.incremental }}" = "true" ]; then
              ARGS="$ARGS --incremental"
            fi
            python scripts/populate_library.py $ARGS
          fi

      - name: Build static site data
        run: |
          cd ancient-books-rag
          python scripts/build_static.py --db-path ../docs/data/library.db

      - name: Move library data to docs
        run: |
          mkdir -p docs/data/texts
          cp ancient-books-rag/docs/data/library-index.json docs/data/ || true
          cp ancient-books-rag/docs/data/library-index.json.gz docs/data/ || true
          cp -r ancient-books-rag/docs/data/texts/* docs/data/texts/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Get current branch name
          BRANCH=$(git branch --show-current)

          # Fetch latest from remote first
          git fetch origin $BRANCH

          # Rebase our working changes on top of latest
          git rebase origin/$BRANCH || git rebase --abort

          # Now stage and commit
          git add docs/data/
          git diff --staged --quiet || git commit -m "${{ github.event.inputs.operation }}: ${{ github.event.inputs.source }}"

          # Push with retry
          for i in 1 2 3 4 5; do
            if git push origin $BRANCH; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retry $i - fetching and rebasing..."
            git fetch origin $BRANCH
            git rebase origin/$BRANCH || git rebase --abort
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
