<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function(){
      var t=localStorage.getItem('aleph-theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aleph · catalogue littéraire universel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23c9a84c'>א</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root, :root[data-theme="dark"] {
      --bg: #070809; --bg2: #0c0d0f; --bg3: #111214;
      --border: rgba(255,255,255,0.07);
      --text: #8a8880; --bright: #edeae4; --dim: #424240;
      --accent: #c9a84c;
      --sans: 'Inter', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', monospace;
    }
    :root[data-theme="light"] {
      --bg: #f5f2ec; --bg2: #ede9e0; --bg3: #e4e0d6;
      --border: rgba(0,0,0,0.09);
      --text: #5a5650; --bright: #1a1916; --dim: #9a9690;
      --accent: #7a5c18;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 14px; line-height: 1.7;
      overflow-x: hidden; min-height: 100vh;
      transition: background 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      pointer-events: none; z-index: 9999; opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      z-index: 100;
    }
    .nav-logo {
      font-family: var(--serif); font-size: 1.3rem; color: var(--accent);
      text-decoration: none;
    }
    .nav-right { display: flex; align-items: center; }
    .nav-right a, .nav-right button {
      font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em;
      color: var(--dim); text-decoration: none;
      background: none; border: none; cursor: pointer;
      padding: 0 1rem;
    }
    .nav-right a:hover, .nav-right button:hover { color: var(--bright); }
    #themeToggle { font-size: 0.85rem; }

    /* HERO */
    .hero {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.5rem; padding: 5rem 1.5rem;
    }
    .hero-glyph {
      font-family: var(--serif);
      font-size: clamp(5rem, 18vw, 8rem);
      color: var(--accent); line-height: 1;
      animation: breathing 8s ease-in-out infinite;
    }
    @keyframes breathing {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--bright); font-weight: 400; text-align: center;
    }
    .hero-sub {
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--dim); letter-spacing: 0.1em; text-align: center;
    }
    .search-wrap { max-width: 560px; width: 100%; }
    #search-input {
      width: 100%; display: block; margin: 0 auto;
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--bright); font-family: var(--mono); font-size: 0.85rem;
      padding: 0.9rem 1.2rem; outline: none;
      transition: border-color 0.2s;
    }
    #search-input::placeholder { color: var(--dim); }
    #search-input:focus { border-color: rgba(201,168,76,0.4); }

    /* RESULTS — hidden until search runs */
    #results-section { display: none; }
    #results-section.visible { display: block; }
    .results-inner {
      max-width: 720px; margin: 0 auto; padding: 0 1.5rem 6rem;
    }
    .results-header {
      font-family: var(--mono); font-size: 0.58rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--dim); margin-bottom: 1.5rem;
    }
    .results-cards { display: flex; flex-direction: column; gap: 1px; background: var(--border); }
    .result-card {
      background: var(--bg); padding: 1.2rem 1.4rem; cursor: default;
      transition: background 0.15s;
    }
    .result-card:hover { background: rgba(201,168,76,0.02); }
    .card-meta {
      font-family: var(--mono); font-size: 0.53rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--accent); opacity: 0.8;
      margin-bottom: 0.5rem;
    }
    .card-excerpt {
      color: var(--text); font-size: 0.82rem; line-height: 1.85;
      margin-bottom: 0.6rem;
    }
    .card-excerpt mark {
      background: rgba(201,168,76,0.18); color: var(--bright); padding: 0 2px;
    }
    .card-expand {
      font-family: var(--mono); font-size: 0.6rem; color: var(--dim);
      cursor: pointer; border: none; background: none; padding: 0;
    }
    .card-expand:hover { color: var(--bright); }
    .card-full {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s ease;
      font-size: 0.82rem; line-height: 1.85; color: var(--text);
    }
    .card-full.expanded { max-height: 600px; margin-top: 0.8rem; }

    /* NO RESULTS */
    .no-results { padding: 2rem 0; background: var(--bg); }
    .no-results p {
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--dim); margin-bottom: 1rem;
    }
    .suggestions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .suggestion-chip {
      border: 1px solid var(--border); font-family: var(--mono); font-size: 0.6rem;
      padding: 0.3rem 0.7rem; color: var(--dim); cursor: pointer;
      background: none; transition: color 0.15s, border-color 0.15s;
    }
    .suggestion-chip:hover { color: var(--bright); border-color: var(--dim); }

    /* AI SYNTHESIS */
    .ai-synthesis {
      border-top: 1px solid var(--border); margin-top: 2rem; padding-top: 1.5rem;
    }
    .ai-label {
      font-family: var(--mono); font-size: 0.55rem; text-transform: uppercase;
      letter-spacing: 0.16em; color: var(--dim); margin-bottom: 1rem;
    }
    .ai-placeholder {
      opacity: 0.35; display: flex; flex-direction: column;
      align-items: flex-start; gap: 0.5rem;
    }
    .ai-icon { color: var(--accent); font-size: 1.2rem; }
    .ai-text {
      font-family: var(--serif); font-style: italic; font-size: 0.85rem;
      color: var(--text);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border); padding: 1rem 1.5rem;
      margin-top: 4rem; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .footer-left { font-family: var(--mono); font-size: 0.58rem; color: var(--dim); }
    .footer-right { display: flex; gap: 1rem; }
    .footer-right a {
      font-family: var(--mono); font-size: 0.58rem; color: var(--dim);
      text-decoration: none; transition: color 0.15s;
    }
    .footer-right a:hover { color: var(--bright); }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero { padding: 4rem 1.2rem; }
      .search-wrap { width: 100%; }
      .nav-right a, .nav-right button { font-size: 0.55rem; padding: 0 0.6rem; }
      .result-card { padding: 1rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">aleph</a>
    <div class="nav-right">
      <a href="archive/index.html">archive ↗</a>
      <a href="#">about</a>
      <button id="themeToggle">◑</button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-glyph">א</div>
    <h1>find the idea across every tradition</h1>
    <p class="hero-sub">search across 10,000+ texts · concepts · traditions · centuries</p>
    <div class="search-wrap">
      <input
        type="text"
        id="search-input"
        placeholder="the sublime · amor fati · negative capability · 無為"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
  </section>

  <section id="results-section">
    <div class="results-inner">
      <p class="results-header" id="resultsHeader"></p>
      <div class="results-cards" id="resultsCards"></div>
      <div class="ai-synthesis">
        <p class="ai-label">CONNEXIONS · synthèse par IA</p>
        <div class="ai-placeholder">
          <span class="ai-icon">◈</span>
          <span class="ai-text">synthèse disponible prochainement</span>
        </div>
        <!-- ── AI SYNTHESIS ──────────────────────────────────────────
             TODO: call Anthropic API here when ready
             Input: query string + top 3 passages from results array
             Output: replace placeholder with synthesis paragraph
             Model: claude-sonnet-4-20250514, max_tokens 500
             Prompt: literary scholar synthesis in French, cite sources
             See: https://docs.anthropic.com/en/api/messages
             ────────────────────────────────────────────────────────── -->
      </div>
    </div>
  </section>

  <!-- Debug info (hidden, inspect via DevTools) -->
  <div id="debug-info" style="display:none"></div>

  <footer>
    <span class="footer-left">aleph · catalogue littéraire universel</span>
    <div class="footer-right">
      <a href="https://guilhermegfmachado.github.io/work" target="_blank" rel="noopener">gmfm ↗</a>
      <a href="https://guilhermegfmachado.github.io/huozi" target="_blank" rel="noopener">活字 ↗</a>
      <a href="archive/index.html">archive ↗</a>
    </div>
  </footer>

  <script>
    // ── DATA ─────────────────────────────────────────────────────
    var manifestData = null;
    var searchData = null;
    var manifestEntries = [];  // flat [{id, title, author, year, tags, lang, category}]
    var searchEntries = [];    // flat [{id, title, author, snippet, year, tags, lang}]

    var TRADITION_FLAGS = {
      'greek': '🏛', 'latin': '🏛', 'roman': '🏛',
      'chinese': '🀄', 'confucius': '🀄', 'taoist': '🀄', 'buddhist': '☸',
      'indian': '🕉', 'hindu': '🕉', 'japanese': '⛩',
      'french': '🇫🇷', 'german': '🇩🇪', 'english': '🇬🇧',
      'portuguese': '🇵🇹', 'persian': '🇮🇷', 'arabic': '🌙',
      'russian': '🇷🇺', 'danish': '🇩🇰', 'norwegian': '🇳🇴',
      'eu': '🇪🇺', 'international': '🌐', 'american': '🇺🇸'
    };

    function getFlag(entry) {
      var combined = (
        (entry.tags || []).join(' ') + ' ' +
        (entry.author || '') + ' ' +
        (entry.category || '')
      ).toLowerCase();
      for (var key in TRADITION_FLAGS) {
        if (combined.indexOf(key) !== -1) return TRADITION_FLAGS[key];
      }
      var langMap = { zh: '🀄', ja: '⛩', ar: '🌙', de: '🇩🇪', fr: '🇫🇷', pt: '🇵🇹', ru: '🇷🇺' };
      return langMap[entry.lang || ''] || '';
    }

    function flattenManifest(manifest) {
      var entries = [];
      var corpus = manifest.corpus || {};
      for (var cat in corpus) {
        var docs = corpus[cat].documents || [];
        for (var i = 0; i < docs.length; i++) {
          var doc = docs[i];
          var langs = Object.keys(doc.languages || {});
          entries.push({
            id: doc.id || '',
            title: doc.title || '',
            author: doc.author || '',
            year: doc.year || '',
            tags: doc.tags || [],
            lang: langs[0] || 'en',
            category: cat,
            snippet: ''
          });
        }
      }
      return entries;
    }

    function flattenSearchDocs(idx) {
      var entries = [];
      var docs = idx.docs || {};
      for (var id in docs) {
        var doc = docs[id];
        var parts = id.split('_');
        entries.push({
          id: id,
          title: doc.title || '',
          author: doc.author || '',
          snippet: doc.snippet || '',
          year: doc.year || '',
          tags: doc.tags || [],
          lang: parts[parts.length - 1] || 'en'
        });
      }
      return entries;
    }

    // Load corpus-manifest
    fetch('data/corpus-manifest.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        manifestData = data;
        manifestEntries = flattenManifest(data);
        // Problem 4: debug logging
        console.log('manifest keys:', Object.keys(data));
        console.log('manifest sample:', JSON.stringify(data).slice(0, 500));
        var dbg = document.getElementById('debug-info');
        if (dbg) dbg.setAttribute('data-manifest', JSON.stringify(data).slice(0, 500));
      })
      .catch(function(e) { console.warn('manifest load failed:', e); });

    // Load search-index with 4s timeout fallback
    var searchTimeout = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('timeout')); }, 4000);
    });
    Promise.race([
      fetch('data/search-index.json').then(function(r) { return r.json(); }),
      searchTimeout
    ])
      .then(function(data) {
        searchData = data;
        searchEntries = flattenSearchDocs(data);
        // Problem 4: debug logging
        console.log('search-index sample:', JSON.stringify(data).slice(0, 500));
        var dbg = document.getElementById('debug-info');
        if (dbg) dbg.setAttribute('data-search', JSON.stringify(data).slice(0, 500));
      })
      .catch(function(e) { console.log('search-index not loaded (fallback to manifest):', e.message); });

    // ── SEARCH (Problem 1 — fixed logic) ─────────────────────────
    function search(rawQuery) {
      var query = rawQuery.trim().toLowerCase();
      if (!query) return [];

      // Use all tokens without length filter — "the sublime" must match as phrase
      var tokens = query.split(/\s+/).filter(Boolean);

      // Use flattened searchEntries if loaded, else manifestEntries
      var entries = searchEntries.length > 0 ? searchEntries : manifestEntries;
      if (!entries.length) return [];

      var results = [];

      for (var i = 0; i < entries.length; i++) {
        var entry = entries[i];
        var title   = (entry.title  || '').toLowerCase();
        var content = (entry.snippet || '').toLowerCase();
        var tags    = (entry.tags || []).join(' ').toLowerCase();
        var author  = (entry.author || '').toLowerCase();
        var all     = title + ' ' + content + ' ' + tags + ' ' + author;

        var score = 0;

        // Exact phrase match (highest value)
        if (all.indexOf(query) !== -1)   score += 20;
        if (title.indexOf(query) !== -1) score += 15;

        // Individual token matches
        for (var j = 0; j < tokens.length; j++) {
          var t = tokens[j];
          if (title.indexOf(t)   !== -1) score += 5;
          if (content.indexOf(t) !== -1) score += 2;
          if (tags.indexOf(t)    !== -1) score += 3;
          if (author.indexOf(t)  !== -1) score += 4;
        }

        if (score === 0) continue;

        // Extract excerpt around first token match
        var excerpt = '';
        var rawContent = entry.snippet || '';
        var contentLower = rawContent.toLowerCase();
        var matchPos = contentLower.indexOf(tokens[0]);
        if (matchPos > -1) {
          var start = Math.max(0, matchPos - 80);
          var end   = Math.min(rawContent.length, matchPos + 200);
          excerpt = rawContent.slice(start, end);
          if (start > 0) excerpt = '\u2026' + excerpt;
          if (end < rawContent.length) excerpt += '\u2026';
        } else if (rawContent) {
          excerpt = rawContent.slice(0, 250) + '\u2026';
        }

        // Highlight tokens in excerpt
        var highlighted = escapeHtml(excerpt);
        for (var k = 0; k < tokens.length; k++) {
          if (tokens[k].length < 2) continue;
          var re = new RegExp('(' + tokens[k].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
          highlighted = highlighted.replace(re, '<mark>$1</mark>');
        }

        results.push({ entry: entry, score: score, excerpt: highlighted });
      }

      results.sort(function(a, b) { return b.score - a.score; });
      return results.slice(0, 7);
    }

    // ── HELPERS ──────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getTraditionCount(results) {
      var seen = {};
      for (var i = 0; i < results.length; i++) {
        var e = results[i].entry;
        seen[e.category || e.lang || 'unknown'] = true;
      }
      return Object.keys(seen).length;
    }

    // ── RENDER ───────────────────────────────────────────────────
    var resultsSection = document.getElementById('results-section');
    var headerEl       = document.getElementById('resultsHeader');
    var cardsEl        = document.getElementById('resultsCards');

    function renderResults(query, results) {
      // Problem 2: show results section
      resultsSection.classList.add('visible');
      cardsEl.innerHTML = '';

      if (results.length === 0) {
        headerEl.textContent = '0 passages \u00b7 ' + query;
        var noRes = document.createElement('div');
        noRes.className = 'no-results';
        noRes.innerHTML =
          '<p>aucun r\u00e9sultat \u2014 essayez\u00a0:</p>' +
          '<div class="suggestions">' +
          ['\u006d\u00e9lancolie', 'the sublime', '\u7121\u70BA', 'amor fati'].map(function(s) {
            return '<button class="suggestion-chip">' + escapeHtml(s) + '</button>';
          }).join('') + '</div>';
        noRes.querySelectorAll('.suggestion-chip').forEach(function(btn) {
          btn.addEventListener('click', function() {
            document.getElementById('search-input').value = btn.textContent;
            runSearch(btn.textContent);
          });
        });
        cardsEl.appendChild(noRes);
      } else {
        headerEl.textContent =
          results.length + ' passages \u00b7 ' +
          getTraditionCount(results) + ' traditions \u00b7 ' + query;

        results.forEach(function(r) {
          var entry = r.entry;
          var flag  = getFlag(entry);
          var metaParts = [];
          if (flag) metaParts.push(flag);
          if (entry.title)  metaParts.push(entry.title.toUpperCase());
          if (entry.author) metaParts.push(entry.author);
          if (entry.year)   metaParts.push(String(entry.year));
          if (entry.lang)   metaParts.push(entry.lang.toUpperCase());

          var fullText = escapeHtml(entry.snippet || '');
          var card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML =
            '<div class="card-meta">' + escapeHtml(metaParts.join(' \u00b7 ')) + '</div>' +
            '<div class="card-excerpt">' + (r.excerpt || '') + '</div>' +
            (fullText
              ? '<button class="card-expand">\u2192 voir le texte complet</button>' +
                '<div class="card-full">' + fullText + '</div>'
              : '');

          if (fullText) {
            var btn  = card.querySelector('.card-expand');
            var full = card.querySelector('.card-full');
            var open = false;
            btn.addEventListener('click', function() {
              open = !open;
              full.classList.toggle('expanded', open);
              btn.textContent = open ? '\u2191 r\u00e9duire' : '\u2192 voir le texte complet';
            });
          }

          cardsEl.appendChild(card);
        });
      }

      // Problem 3: auto scroll to results
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function runSearch(query) {
      query = (query || '').trim();
      if (!query) return;
      var results = search(query);
      renderResults(query, results);
    }

    document.getElementById('search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') runSearch(this.value);
    });

    // ── THEME TOGGLE ─────────────────────────────────────────────
    (function() {
      var saved = localStorage.getItem('aleph-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        btn.textContent = (localStorage.getItem('aleph-theme') || 'dark') === 'dark' ? '\u25d1' : '\u25d0';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('aleph-theme', next);
          btn.textContent = next === 'dark' ? '\u25d1' : '\u25d0';
        });
      });
    })();
  </script>

</body>
</html>
