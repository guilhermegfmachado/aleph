<head>

    <meta charset="UTF-8">

    <meta property="og:description" content="Glossaire multilingue de termes historiques, littéraires, politiques et philosophiques.">
    <meta property="og:url" content="https://guilhermegfmachado.github.io/aleph/glossaire.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://guilhermegfmachado.github.io/aleph/glossaire.html">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="theme-color" content="#070809">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <a href="../index.html" class="nav-logo">א</a>
        <ul class="nav-links">
            <li><a href="../index.html">chercher</a></li>
            <li><a href="browse.html">parcourir</a></li>
            <li><a href="glossaire.html" class="active">glossaire</a></li>
            <li><a href="../sources.html">références</a></li>
        </ul>
        <button class="nav-theme-btn" id="themeToggle" aria-label="basculer thème" title="thème clair / sombre">&#9681;</button>
    </nav>

    <main class="glossaire-page">
        <div class="glossaire-header">
            <h1 class="glossaire-title">Glossaire <em>multilingue</em></h1>
            <div class="glossaire-stats">
                <span id="term-count">0</span> termes · <span id="quote-count">0</span> citations · <span id="lang-count">0</span> langues
            </div>
        </div>

        <!-- Search -->
        <input type="search" id="glossSearch" class="glossaire-search" placeholder="chercher un terme...">

        <!-- Language pills (populated by JS) -->
        <div class="lang-pills-row" id="langPills"></div>

        <!-- Category filter (populated by JS) -->
        <div class="category-filter">
            <select id="catFilter" class="cat-select"></select>
        </div>

        <!-- Terms List -->
        <div id="termsList" class="terms-list"></div>

        <!-- Add Entry Section -->
        <div id="addEntrySection" class="add-entry-section collapsed">
            <button type="button" id="addToggle" class="add-toggle-btn">+ ajouter une entrée</button>
            <form id="addTermForm" class="entry-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="termWord">terme *</label>
                        <input type="text" id="termWord" required placeholder="Vermassung">
                    </div>
                    <div class="form-group">
                        <label for="termLang">langue *</label>
                        <select id="termLang" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="termNative">écriture native</label>
                    <input type="text" id="termNative" placeholder="native script / prononciation">
                </div>
                <div class="form-group">
                    <label for="termDefinition">définition *</label>
                    <textarea id="termDefinition" required rows="3" placeholder="Mass-ification; the process by which..."></textarea>
                </div>
                <div class="form-group">
                    <label for="termEtymology">étymologie</label>
                    <input type="text" id="termEtymology" placeholder="From German 'Masse' (mass) + '-ung'">
                </div>
                <div class="form-group">
                    <label for="termCategory">domaine (séparés par virgule)</label>
                    <input type="text" id="termCategory" placeholder="philosophy, sociology">
                </div>
                <div class="form-group">
                    <label for="termPeriod">période</label>
                    <input type="text" id="termPeriod" placeholder="20th century">
                </div>
                <div class="form-group">
                    <label for="termRelated">voir aussi (séparés par virgule)</label>
                    <input type="text" id="termRelated" placeholder="Entfremdung, Gleichschaltung">
                </div>
                <button type="submit" class="btn">ajouter terme</button>
            </form>
        </div>
    </main>

    <a class="site-credit" href="https://guilhermegfmachado.github.io/work/" target="_blank" rel="noopener">gmfm</a>
    <script src="app.js"></script>
    <script src="glossaire.js"></script>
</body>
</html>
