[project]
name = "ancient-books-rag"
version = "0.1.0"
description = "RAG system for ancient classical texts - grounded answers from primary sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core RAG stack
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "anthropic>=0.18.0",

    # Text processing
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html2text>=2024.2.26",

    # Data handling
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
ancient-rag = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
