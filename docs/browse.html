<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aleph - browse</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>א</h1>
            <p class="subtitle">universal catalog</p>
            <nav>
                <a href="index.html">search</a>
                <a href="browse.html" class="active">browse</a>
                <a href="sources.html">sources</a>
                <a href="upload.html">add</a>
            </nav>
        </header>

        <main>
            <div class="catalog-stats" id="catalog-stats">
                <div class="stats-summary">
                    <span id="total-books">0</span> texts from <span id="total-sources">0</span> sources
                </div>
                <div class="stats-breakdown" id="stats-breakdown"></div>
            </div>

            <div class="browse-filters">
                <select id="type-filter">
                    <option value="">all types</option>
                </select>
                <select id="period-filter">
                    <option value="">all periods</option>
                </select>
                <select id="author-filter">
                    <option value="">all authors</option>
                </select>
                <select id="source-filter">
                    <option value="">all sources</option>
                </select>
                <select id="sort-filter">
                    <option value="title">sort: title</option>
                    <option value="author">sort: author</option>
                    <option value="type">sort: type</option>
                    <option value="period">sort: period</option>
                </select>
                <select id="view-filter">
                    <option value="list">list view</option>
                    <option value="compact">compact</option>
                </select>
            </div>

            <div id="book-list" class="books-list">
                <div class="loading">loading...</div>
            </div>

            <div id="pagination" class="pagination"></div>
        </main>

        <footer>
            <p id="sources-footer"></p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>initBrowse();</script>
</body>
</html>
