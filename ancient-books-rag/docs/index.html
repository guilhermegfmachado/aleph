<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>borges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>borges</h1>
            <p class="subtitle">a personal library</p>
            <nav>
                <a href="index.html" class="active">search</a>
                <a href="browse.html">browse</a>
            </nav>
        </header>

        <main>
            <div class="search-box">
                <input
                    type="text"
                    id="search-input"
                    placeholder="search: love, justice, death, virtue..."
                    autofocus
                >
                <div class="search-filters">
                    <select id="author-filter">
                        <option value="">all authors</option>
                    </select>
                    <select id="source-filter">
                        <option value="">all sources</option>
                    </select>
                    <button id="search-btn">search</button>
                </div>
            </div>

            <div class="search-tips">
                <p>use quotes for exact phrases ("know thyself")</p>
            </div>

            <div id="results" class="results">
                <div class="welcome" id="welcome">
                    <h2><span id="book-count">0</span> texts from <span id="author-count">0</span> authors</h2>
                    <div class="quick-searches">
                        <p>try:</p>
                        <div class="quick-links">
                            <a href="#" class="quick-search" data-query="love">love</a>
                            <a href="#" class="quick-search" data-query="death">death</a>
                            <a href="#" class="quick-search" data-query="justice">justice</a>
                            <a href="#" class="quick-search" data-query="virtue">virtue</a>
                            <a href="#" class="quick-search" data-query="war">war</a>
                            <a href="#" class="quick-search" data-query="soul">soul</a>
                            <a href="#" class="quick-search" data-query="fate">fate</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p id="sources-footer">sources: loading...</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
