<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aleph</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container wide">
        <header>
            <h1>א</h1>
            <p class="subtitle">universal catalog</p>
            <nav>
                <a href="index.html">search</a>
                <a href="browse.html">browse</a>
                <a href="sources.html">sources</a>
                <a href="upload.html">add</a>
            </nav>
        </header>

        <main class="book-view">
            <div class="book-header" id="book-header">
                <div class="book-meta">
                    <h2 id="book-title">...</h2>
                    <p id="book-author" class="author"></p>
                    <div id="book-tags" class="tags"></div>
                </div>
                <div class="language-controls" id="language-controls">
                    <!-- Filled dynamically -->
                </div>
            </div>

            <div class="view-toggle" id="view-toggle">
                <button class="view-btn active" data-view="single">single</button>
                <button class="view-btn" data-view="parallel">parallel</button>
            </div>

            <div id="pdf-controls" class="pdf-controls hidden">
                <button id="pdf-prev" class="btn btn-small">prev</button>
                <span id="pdf-page-info">page 1 of 1</span>
                <button id="pdf-next" class="btn btn-small">next</button>
                <span class="pdf-separator">|</span>
                <button id="pdf-zoom-out" class="btn btn-small">-</button>
                <span id="pdf-zoom-info">100%</span>
                <button id="pdf-zoom-in" class="btn btn-small">+</button>
                <span class="pdf-separator">|</span>
                <input type="text" id="pdf-search" placeholder="search..." class="pdf-search-input">
                <button id="pdf-search-btn" class="btn btn-small">find</button>
            </div>
            <div id="pdf-search-results" class="pdf-search-results hidden"></div>

            <!-- Translation popup -->
            <div id="translate-popup" class="translate-popup hidden">
                <div class="translate-header">
                    <select id="translate-lang">
                        <option value="pt" selected>Português</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                        <option value="zh-CN">中文</option>
                        <option value="ja">日本語</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="la">Latina</option>
                    </select>
                    <button id="translate-close" class="btn-close">x</button>
                </div>
                <div id="translate-original" class="translate-text"></div>
                <div id="translate-result" class="translate-result">select text to translate</div>
            </div>

            <div id="book-content" class="book-content single-view">
                <div class="loading">loading...</div>
            </div>

            <div id="pdf-container" class="pdf-container hidden">
                <canvas id="pdf-canvas"></canvas>
            </div>
        </main>

        <footer></footer>
    </div>

    <script src="app.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        initBookView();
    </script>
</body>
</html>
